# Render Blueprint: веб-сервис + PostgreSQL.
# https://render.com/docs/blueprint-spec
#
# Развёртывание: Render Dashboard → New → Blueprint → указать репозиторий.
# Render прочитает этот файл и создаст оба ресурса.

databases:
  - name: cv-app-db
    databaseName: cv_app
    user: app
    plan: free
    postgresMajorVersion: "16"
    # Бесплатный план Render удаляет базу через 30 дней.
    # Перед защитой проекта стоит либо перейти на платный план,
    # либо пересоздать базу и прогнать фикстуры заново.

services:
  - type: web
    name: cv-app
    runtime: docker
    plan: free
    dockerfilePath: ./docker/prod.Dockerfile
    # Контекст сборки — корень репозитория, потому что Dockerfile
    # копирует и backend/, и frontend/.
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true

    envVars:
      # Строка подключения берётся из созданной выше базы.
      # Symfony ожидает суффикс ?serverVersion=16, поэтому DATABASE_URL
      # собирается в entrypoint из этого значения (см. ниже).
      - key: DATABASE_URL_RAW
        fromDatabase:
          name: cv-app-db
          property: connectionString

      - key: APP_ENV
        value: prod

      - key: APP_DEBUG
        value: "0"

      # Секрет для подписи сессий/токенов. sync: false означает,
      # что Render сгенерирует значение сам и не станет хранить его в git.
      - key: APP_SECRET
        generateValue: true

      # Пароль приватного ключа JWT. Ключи не коммитятся: пара генерируется
      # в entrypoint при старте контейнера из этого значения.
      - key: JWT_PASSPHRASE
        generateValue: true

      - key: JWT_SECRET_KEY
        value: /var/www/backend/config/jwt/private.pem

      - key: JWT_PUBLIC_KEY
        value: /var/www/backend/config/jwt/public.pem

      # Время жизни токена в секундах.
      - key: JWT_TTL
        value: "3600"

      # Ключи OAuth-приложений. sync: false — значения вводятся в дашборде
      # Render вручную и не попадают в репозиторий.
      - key: OAUTH_GOOGLE_ID
        sync: false

      - key: OAUTH_GOOGLE_SECRET
        sync: false

      - key: OAUTH_GITHUB_ID
        sync: false

      - key: OAUTH_GITHUB_SECRET
        sync: false

      # --- Почта ---
      # Письма с подтверждением регистрации. sync: false — строку с ключом
      # вводим в дашборде, в репозиторий она не попадает.
      #
      # Только Mailgun через HTTP API:
      #   mailgun+api://KEY:DOMAIN@default?region=us
      #
      # SMTP здесь не работает в принципе: на бесплатном плане Render
      # исходящие порты 25/465/587 заблокированы — соединение не отвергается,
      # а висит до таймаута, и nginx отдаёт 504. Проверить можно запросом
      # к /api/diagnostics/mail с заголовком X-Diagnostics-Token.
      - key: MAILER_DSN
        sync: false

      # Адрес отправителя ОБЯЗАН быть на домене, подключённом в Mailgun,
      # иначе API отвечает отказом и письмо не уходит. Для sandbox-домена
      # это, например, no-reply@sandbox123.mailgun.org.
      # На sandbox-домене письма к тому же уходят только на адреса,
      # добавленные в Mailgun как Authorized Recipients.
      - key: MAILER_FROM_ADDRESS
        sync: false

      - key: MAILER_FROM_NAME
        value: CVMatch

      # --- Диагностика ---
      # Пока переменная пуста, /api/diagnostics/mail отвечает 404.
      # Чтобы разобраться с почтой в проде, задайте здесь случайную строку
      # и передайте её в заголовке X-Diagnostics-Token. Endpoint показывает
      # хост и порт SMTP-сервера, поэтому без токена его открывать нельзя.
      - key: DIAGNOSTICS_TOKEN
        sync: false

      # FRONTEND_URL не задаём: фронтенд обслуживается тем же сервисом,
      # и entrypoint подставляет в него RENDER_EXTERNAL_URL, который
      # платформа передаёт в контейнер сама.
