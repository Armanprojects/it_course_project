# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # The OAuth callback has to know where the SPA lives to hand the token back.
    App\Controller\OAuthController:
        arguments:
            $frontendUrl: '%env(FRONTEND_URL)%'

    App\Service\Auth\EmailVerificationService:
        arguments:
            $frontendUrl: '%env(FRONTEND_URL)%'
            $senderAddress: '%env(MAILER_FROM_ADDRESS)%'
            $senderName: '%env(MAILER_FROM_NAME)%'
            # Канал mail пишет в stderr сразу, без буфера fingers_crossed,
            # иначе записи теряются, когда nginx обрывает запрос по таймауту.
            # Имя аргумента $mailLogger + тег monolog.logger — так бандл
            # подставляет логгер нужного канала (см. config/packages/monolog.yaml).
            $mailLogger: '@monolog.logger.mail'
            # DSN нужен только для лога: из него берутся схема, хост и порт,
            # чтобы в логе было видно, куда шла отправка. Логин и пароль
            # в лог не попадают — см. describeTransport().
            $mailerDsn: '%env(MAILER_DSN)%'

    # Диагностика почты. Отключена, пока в окружении нет DIAGNOSTICS_TOKEN.
    App\Controller\MailDiagnosticsController:
        arguments:
            $mailLogger: '@monolog.logger.mail'
            $mailerDsn: '%env(MAILER_DSN)%'
            $senderAddress: '%env(MAILER_FROM_ADDRESS)%'
            $frontendUrl: '%env(FRONTEND_URL)%'
            $diagnosticsToken: '%env(DIAGNOSTICS_TOKEN)%'
        tags: ['controller.service_arguments']

    App\EventSubscriber\ApiExceptionSubscriber:
        arguments:
            $debug: '%kernel.debug%'

    # Архив писем: в dev складывает отправленные письма в var/mail,
    # чтобы ссылку подтверждения можно было открыть без SMTP.
    # В prod автоподписка снимается (см. when@prod ниже): копии писем
    # на диске в бою не нужны и были бы утечкой персональных данных.
    App\EventSubscriber\MailArchiveSubscriber:
        arguments:
            $archiveDir: '%kernel.project_dir%/var/mail'

    App\Command\ShowLastMailCommand:
        arguments:
            $archiveDir: '%kernel.project_dir%/var/mail'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@prod:
    services:
        App\EventSubscriber\MailArchiveSubscriber:
            arguments:
                $archiveDir: '%kernel.project_dir%/var/mail'
            autoconfigure: false
