monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        # Отдельный канал для отправки почты. Нужен, чтобы записи об отправке
        # шли мимо буфера fingers_crossed (см. комментарий в when@prod).
        - mail

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            # --- Почта: пишем сразу, без буферизации ---
            # Обработчик объявлен ПЕРВЫМ: Monolog идёт по стеку сверху вниз,
            # а main ниже перехватывает канал mail и до этого хендлера
            # запись бы не дошла.
            #
            # Почему не через main: main — это fingers_crossed, он копит
            # записи в памяти и сбрасывает их на диск только когда случится
            # ERROR. Если nginx обрывает запрос по fastcgi_read_timeout,
            # процесс PHP убивают вместе с буфером, и в логах Render не
            # остаётся ничего — ровно тот случай, который мы и разбираем.
            # Прямой stream пишет каждую строку сразу.
            mail:
                type: stream
                path: php://stderr
                level: info
                channels: [mail]
                formatter: monolog.formatter.json

            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation", "!mail"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
