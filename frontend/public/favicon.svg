<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CVMatch">
  <!-- Тот же знак, что и в шапке: монограмма CV на тёмном скруглённом
       квадрате. В тёмной теме браузера подложка светлеет, иначе чёрный значок
       сливается с тёмной полосой вкладок. -->
  <style>
    .plate { fill: #0f172a; }
    .mark  { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #e2e8f0; }
      .mark  { fill: #0f172a; }
    }
  </style>

  <rect class="plate" width="64" height="64" rx="14" />

  <!-- Буквы нарисованы контурами, а не <text>: системного шрифта у значка
       нет, и текст отрисовался бы по-разному в каждой ОС. -->
  <path class="mark" d="M29.4 21.6c-2.4-2.2-5.6-3.4-9-3.4-7.7 0-13.4 5.9-13.4 13.8S12.7 45.8 20.4 45.8c3.4 0 6.6-1.2 9-3.5v-7.2c-2 2.6-4.9 4.1-8.1 4.1-4.5 0-7.7-3.3-7.7-7.9s3.2-7.9 7.7-7.9c3.2 0 6.1 1.5 8.1 4.1z" />
  <path class="mark" d="M33.4 18.8h7.1l6.4 17.3 6.4-17.3h7.1L49.9 45.2h-5.9z" />
</svg>
