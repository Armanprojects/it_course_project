# Dev-окружение. Запуск: docker compose up
# Приложение: http://localhost:8080
# API:        http://localhost:8080/api/health

services:
  # --- PostgreSQL ---
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cv_app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      # Пробрасываем наружу, чтобы можно было подключиться из DataGrip/DBeaver.
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # php стартует только когда БД реально готова принимать соединения,
      # иначе Doctrine падает на первой же миграции.
      test: ["CMD-SHELL", "pg_isready -U app -d cv_app"]
      interval: 5s
      timeout: 3s
      retries: 10

  # --- Symfony (php-fpm) ---
  php:
    build:
      context: .
      dockerfile: docker/php.Dockerfile
    volumes:
      - ./backend:/var/www/backend
      # Настройки PHP под медленный том Windows (см. комментарии в файле).
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro
      # Пул php-fpm: статичные воркеры, которые не убиваются по простою,
      # чтобы не платить за прогрев процесса на ровном месте.
      - ./docker/php-fpm-dev.conf:/usr/local/etc/php-fpm.d/zz-dev.conf:ro
      # Кэш Symfony держим в томе Docker, а не на хосте: он пишется сотнями
      # файлов, и через проброс с Windows каждый запрос стоил секунд.
      # Именованные тома монтируются поверх ./backend, поэтому указываем
      # именно подкаталоги, а не var/ целиком.
      - backend_cache:/var/www/backend/var/cache
      - backend_log:/var/www/backend/var/log
      # vendor/ — та же история, что и с кэшем, но дороже: Symfony в dev
      # подключает с него ~340 файлов за запрос, и чтение через проброс с
      # Windows стоит ~0.65 с там, где с диска контейнера уходит 0.004 с.
      # Именно это, а не компиляция PHP, давало секундные ответы: профиль
      # boot'а — 0.43 с CPU против 2.7 с ожидания I/O.
      #
      # Зависимости ставит сам контейнер (см. command ниже), поэтому том
      # наполняется при первом старте. После правки composer.json выполнить:
      #   docker compose exec php composer install
      - backend_vendor:/var/www/backend/vendor
    environment:
      DATABASE_URL: "postgresql://app:app@db:5432/cv_app?serverVersion=16&charset=utf8"
      APP_ENV: dev
      APP_DEBUG: "1"
    depends_on:
      db:
        condition: service_healthy
    # Том backend_vendor изначально пуст и перекрывает vendor/ с хоста,
    # поэтому зависимости ставятся внутри контейнера при первом запуске.
    # Проверка composer.lock делает повторные старты почти мгновенными.
    command: >
      sh -c "if [ ! -f vendor/autoload_runtime.php ]; then
               composer install --no-interaction --prefer-dist;
             fi;
             exec php-fpm"

  # --- Vite dev server ---
  frontend:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    volumes:
      - ./frontend:/var/www/frontend
      # Именованный том для node_modules: не даём Windows-хосту перетереть
      # зависимости, установленные внутри Linux-контейнера.
      - frontend_node_modules:/var/www/frontend/node_modules

  # --- nginx: единая точка входа ---
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      # public/ нужен nginx, чтобы отдавать SCRIPT_FILENAME в php-fpm.
      - ./backend:/var/www/backend:ro
    depends_on:
      - php
      - frontend

volumes:
  db_data:
  frontend_node_modules:
  backend_cache:
  backend_log:
  backend_vendor:
