; Пул php-fpm для разработки.
;
; pm = dynamic по умолчанию убивает простаивающие воркеры и создаёт новые.
; Каждый новый воркер заново читает ~340 файлов Symfony и строит DI-контейнер;
; с vendor/ в томе Docker это стоит ~0.4 с, но платить её на ровном месте
; незачем — статичный пул держит воркеры прогретыми.
;
; Основную задержку (секунды) снимал не этот файл, а перенос vendor/ и
; var/cache в тома Docker — см. комментарии в docker-compose.yml.
[www]

pm = static
pm.max_children = 4

; 0 = не перезапускать воркер после N запросов: перезапуск сбрасывает
; прогретое состояние процесса.
pm.max_requests = 0
