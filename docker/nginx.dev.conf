# Dev-конфигурация: один вход на localhost:8080.
# /api/*  -> php-fpm (Symfony)
# всё остальное -> Vite dev server (с горячей перезагрузкой)
#
# Смысл единой точки входа: браузер видит один origin, поэтому CORS не нужен
# ни в dev, ни в prod. Это же снимает будущие проблемы с httpOnly-cookie для JWT.

server {
    listen 80;
    server_name localhost;

    # Загрузка файлов пока не используется (изображения идут в облако по ТЗ),
    # но пусть лимит будет разумным.
    client_max_body_size 8m;

    # --- Symfony API ---
    location /api {
        # Все запросы /api/* обрабатывает единая точка входа Symfony.
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/backend/public;
        # Symfony читает REQUEST_URI, чтобы определить маршрут.
        fastcgi_param REQUEST_URI     $request_uri;

        fastcgi_read_timeout 60s;
    }

    # --- Vite dev server ---
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;

        # Vite использует WebSocket для HMR — без этих двух заголовков
        # горячая перезагрузка молча не работает.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
