# Prod-конфигурация: nginx и php-fpm живут в одном контейнере.
#
# Отличия от dev:
#   - фронтенд отдаётся как собранная статика из /var/www/frontend/dist,
#     а не проксируется на Vite dev server;
#   - SPA-fallback: любой неизвестный путь отдаёт index.html, иначе
#     react-router сломается при перезагрузке страницы на /positions/42;
#   - php-fpm слушает 127.0.0.1, потому что процесс в том же контейнере.
#
# Render передаёт порт через переменную $PORT, поэтому файл обрабатывается
# envsubst в docker/entrypoint.sh перед стартом nginx.

server {
    listen ${PORT};
    server_name _;

    root /var/www/frontend/dist;
    index index.html;

    client_max_body_size 8m;

    # Сжатие: заметно уменьшает размер JS-бандла Bootstrap + React.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # --- Symfony API ---
    location /api {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT   /var/www/backend/public;
        fastcgi_param REQUEST_URI     $request_uri;
        # Render терминирует TLS у себя, до контейнера доходит http.
        # Без этого Symfony генерирует ссылки с http:// вместо https://.
        fastcgi_param HTTPS           $http_x_forwarded_proto;

        fastcgi_read_timeout 60s;
    }

    # --- Статика с хэшами в имени (assets/index-a1b2c3.js) ---
    # Хэш меняется при каждой сборке, поэтому кэшируем навсегда.
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- SPA-fallback ---
    location / {
        # index.html не кэшируем: иначе после деплоя браузер продолжит
        # запрашивать старые (уже удалённые) файлы с хэшами.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
