; Настройки PHP для разработки на Windows.
;
; Код лежит на смонтированном с хоста томе, а обращение к нему идёт через
; прослойку Docker Desktop — один stat() файла стоит ~0.5-7 мс вместо
; микросекунд. Symfony в dev-режиме трогает около тысячи файлов за запрос,
; поэтому проверка изменений съедала несколько секунд на каждый ответ.

[opcache]
opcache.enable = 1
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000

; Главный рычаг: без этого PHP делает stat() каждого закэшированного файла
; на каждом запросе. Изменения в коде подхватываются раз в 30 секунд.
; Если правка не видна — docker compose restart php.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 30

; Не проверять существование файла перед include: путь и так резолвится
; через realpath cache ниже.
opcache.enable_file_override = 0

[performance]
; Кэш разрешённых путей. Значения по умолчанию (16K / 120 c) не вмещают
; дерево vendor/, из-за чего пути резолвились заново на каждом запросе.
realpath_cache_size = 8192K
realpath_cache_ttl = 600
